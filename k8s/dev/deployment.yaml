apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-operations-service
  namespace: gym-dev
  labels:
    app: gym-operations-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gym-operations-service
  template:
    metadata:
      labels:
        app: gym-operations-service
    spec:
      containers:
        - name: gym-operations-service
          image: gym-operations-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: gym-operations-config
          env:
            - name: DB_HOST
              value: "operations-postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: operations-postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: operations-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: operations-postgres-credentials
                  key: POSTGRES_DB
            - name: REDIS_URL
              value: "redis://operations-redis:6379"
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"