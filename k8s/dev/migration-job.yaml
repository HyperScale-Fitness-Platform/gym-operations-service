apiVersion: batch/v1
kind: Job
metadata:
  name: gym-operations-migration
  namespace: gym-dev
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: gym-operations-service:dev
          command: ["npm", "run", "migration:run"]
          env:
            - name: DB_HOST
              value: "operations-postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: operations-postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: operations-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: operations-postgres-credentials
                  key: POSTGRES_DB